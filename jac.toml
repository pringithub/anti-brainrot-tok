[project]
name = "anti-brainrot-tok"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main.jac"
kind = "fullstack"

[dependencies]
requests = ">=2.31"
defusedxml = ">=0.7"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[scripts]
# Per-file: `jac check .` walks into .venv, and batch runs report false sv-type mismatches.
check = "for f in main.jac services/*.sv.jac components/*.cl.jac tools/*.jac tests/*.jac; do jac check $f 2>&1 | grep -E 'PASSED|FAILED|error\\['; done"
test = "jac test tests/agents_tests.jac"

[plugins.client]

[plugins.client.app_meta_data]
title = "SmartTok"
description = "Short videos worth your time: science, engineering, history, languages, DIY and balanced news."
theme_color = "#07080c"
