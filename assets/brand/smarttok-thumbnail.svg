<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3f49"/>
      <stop offset="1" stop-color="#1c1e24"/>
    </linearGradient>
    <linearGradient id="bgRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="0.55" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8ff4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8ff4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smartScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="learnText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="leftHalf"><polygon points="0,0 700,0 580,720 0,720"/></clipPath>
    <clipPath id="rightHalf"><polygon points="700,0 1280,0 1280,720 580,720"/></clipPath>
    <g id="sparkle"><path d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14 Z"/></g>
  </defs>

  <!-- ============ LEFT: brainrot ============ -->
  <g clip-path="url(#leftHalf)">
    <rect width="1280" height="720" fill="url(#bgLeft)"/>
    <g stroke="#9aa3b2" stroke-opacity="0.12" stroke-width="2">
      <line x1="40" y1="0" x2="10" y2="90"/><line x1="140" y1="40" x2="110" y2="130"/>
      <line x1="520" y1="20" x2="490" y2="110"/><line x1="600" y1="200" x2="570" y2="290"/>
      <line x1="70" y1="260" x2="40" y2="350"/><line x1="560" y1="420" x2="530" y2="510"/>
      <line x1="20" y1="470" x2="-10" y2="560"/>
    </g>

    <text x="300" y="138" text-anchor="middle" font-size="64" font-weight="900" fill="#a3e635"
          stroke="#1a2e05" stroke-width="3" paint-order="stroke" transform="rotate(-4 300 138)" letter-spacing="2">BRAINROT</text>

    <!-- melting brain -->
    <g transform="translate(292 210)">
      <g fill="#b99aa1" stroke="#6b5359" stroke-width="3">
        <path d="M-58 8 C-78 -20 -52 -48 -28 -40 C-22 -64 14 -66 22 -44 C46 -58 74 -34 60 -8 C80 6 66 34 44 30 L-44 30 C-70 32 -76 18 -58 8 Z"/>
        <path d="M-40 30 C-38 52 -30 60 -28 48 C-26 36 -20 34 -18 30 Z"/>
        <path d="M2 30 C4 66 14 76 16 56 C18 42 20 36 22 30 Z"/>
        <path d="M34 30 C36 48 44 52 44 42 C44 36 42 32 42 30 Z"/>
      </g>
      <path d="M-30 -16 C-16 -24 -4 -8 10 -18 M18 0 C30 -10 40 4 50 -6 M-44 10 C-30 2 -18 16 -4 6" fill="none" stroke="#6b5359" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- sad person -->
    <g transform="translate(300 0)">
      <path d="M-160 720 C-160 570 -118 488 0 488 C118 488 160 570 160 720 Z" fill="#4b5563"/>
      <rect x="-22" y="436" width="44" height="64" rx="10" fill="#dcae8c"/>
      <g transform="rotate(14 0 380)">
        <circle cx="0" cy="372" r="84" fill="#f1c7a3"/>
        <circle cx="0" cy="372" r="84" fill="#b8ff4d" opacity="0.14"/>
        <path d="M-86 362 C-96 276 -22 256 8 268 C62 248 104 300 88 352 C72 322 44 306 12 314 C-18 302 -58 322 -86 362 Z" fill="#2d2a32"/>
        <path d="M-48 374 q16 9 32 0 M16 374 q16 9 32 0" fill="none" stroke="#2d2a32" stroke-width="5" stroke-linecap="round"/>
        <path d="M-48 390 q16 10 32 0 M16 390 q16 10 32 0" fill="none" stroke="#a9826b" stroke-width="3" stroke-linecap="round"/>
        <path d="M-22 428 q22 -9 44 0" fill="none" stroke="#7a4a3a" stroke-width="4" stroke-linecap="round"/>
        <path d="M16 430 C12 444 14 452 20 452 C26 452 28 444 22 430 Z" fill="#9fd8ff"/>
      </g>
      <ellipse cx="60" cy="560" rx="170" ry="130" fill="url(#phoneGlow)"/>
      <path d="M-112 548 Q-66 648 26 616" fill="none" stroke="#4b5563" stroke-width="48" stroke-linecap="round"/>
      <path d="M112 548 Q128 624 84 614" fill="none" stroke="#4b5563" stroke-width="48" stroke-linecap="round"/>
      <g transform="translate(58 556) rotate(-8)">
        <rect x="-58" y="-98" width="116" height="196" rx="18" fill="#0f1115"/>
        <rect x="-50" y="-88" width="100" height="176" rx="12" fill="#c6ff57"/>
        <text x="0" y="-62" text-anchor="middle" font-size="15" font-weight="900" fill="#1a1a1a">skibidi???</text>
        <g stroke="#333" stroke-width="2.5">
          <rect x="-18" y="-46" width="36" height="24" rx="4" fill="#ffffff"/>
          <path d="M-28 -6 Q-24 34 0 38 Q24 34 28 -6 Z" fill="#ffffff"/>
          <circle cx="0" cy="-12" r="15" fill="#f1c7a3"/>
          <ellipse cx="0" cy="-4" rx="32" ry="11" fill="#ffffff"/>
        </g>
        <circle cx="0" cy="-14" r="14" fill="#f1c7a3" stroke="#333" stroke-width="2.5"/>
        <circle cx="-5" cy="-17" r="2.5" fill="#111"/><circle cx="5" cy="-17" r="2.5" fill="#111"/>
        <ellipse cx="0" cy="-8" rx="4" ry="3" fill="#7a2e2e"/>
        <text x="0" y="68" text-anchor="middle" font-size="22" font-weight="900" fill="#1a1a1a">!!!</text>
      </g>
      <circle cx="-2" cy="612" r="24" fill="#f1c7a3"/>
      <circle cx="118" cy="598" r="24" fill="#f1c7a3"/>
      <text x="-190" y="330" font-size="34" font-weight="800" fill="#9aa3b2" opacity="0.55">zzz</text>
      <text x="150" y="300" font-size="30" font-weight="800" fill="#9aa3b2" opacity="0.5">?!</text>
    </g>
  </g>

  <!-- ============ RIGHT: learning ============ -->
  <g clip-path="url(#rightHalf)">
    <rect width="1280" height="720" fill="url(#bgRight)"/>
    <rect width="1280" height="720" fill="url(#glowRight)"/>

    <text x="990" y="138" text-anchor="middle" font-size="64" font-weight="900" fill="url(#learnText)"
          stroke="#312e81" stroke-width="3" paint-order="stroke" letter-spacing="2">LEARNING</text>

    <!-- lightbulb -->
    <g transform="translate(982 214)">
      <g stroke="#fef08a" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="-48"/><line x1="-46" y1="-40" x2="-36" y2="-30"/>
        <line x1="46" y1="-40" x2="36" y2="-30"/><line x1="-60" y1="0" x2="-48" y2="0"/>
        <line x1="60" y1="0" x2="48" y2="0"/>
      </g>
      <circle cx="0" cy="0" r="36" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
      <path d="M-10 6 L-4 -8 L4 6 L10 -8" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-16" y="34" width="32" height="18" rx="4" fill="#94a3b8"/>
    </g>

    <!-- floating subject icons -->
    <g transform="translate(760 250)" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9">
      <ellipse rx="34" ry="12"/><ellipse rx="34" ry="12" transform="rotate(60)"/><ellipse rx="34" ry="12" transform="rotate(-60)"/>
      <circle r="5" fill="#ffffff"/>
    </g>
    <g transform="translate(1215 470)" opacity="0.9">
      <circle r="30" fill="none" stroke="#ffffff" stroke-width="4"/>
      <ellipse rx="14" ry="30" fill="none" stroke="#ffffff" stroke-width="3"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="3"/>
    </g>
    <text x="672" y="520" font-size="54" font-weight="900" fill="#ffffff" opacity="0.85">π</text>
    <text x="1170" y="620" font-size="40" font-weight="900" fill="#ffffff" opacity="0.85">Aa</text>
    <g transform="translate(730 620)" opacity="0.85">
      <path d="M-34 -22 L0 -14 L34 -22 L34 20 L0 28 L-34 20 Z" fill="#ffffff"/>
      <line x1="0" y1="-14" x2="0" y2="28" stroke="#4f46e5" stroke-width="3"/>
    </g>
    <g fill="#fef9c3">
      <use href="#sparkle" transform="translate(850 180) scale(1.1)"/>
      <use href="#sparkle" transform="translate(1130 150) scale(0.8)"/>
      <use href="#sparkle" transform="translate(1210 380) scale(0.9)"/>
      <use href="#sparkle" transform="translate(720 340) scale(0.7)"/>
    </g>

    <!-- happy person -->
    <g transform="translate(980 0)">
      <path d="M-160 720 C-160 556 -118 478 0 478 C118 478 160 556 160 720 Z" fill="#f59e0b"/>
      <path d="M-40 490 L0 540 L40 490" fill="none" stroke="#b45309" stroke-width="5" stroke-linejoin="round"/>
      <rect x="-22" y="420" width="44" height="66" rx="10" fill="#dcae8c"/>
      <circle cx="0" cy="352" r="84" fill="#f1c7a3"/>
      <path d="M-86 344 C-92 262 -22 242 8 252 C62 234 104 282 88 334 C74 306 44 292 12 298 C-18 288 -58 304 -86 344 Z" fill="#2d2a32"/>
      <path d="M-50 318 q16 -12 32 -2 M18 316 q16 -10 32 2" fill="none" stroke="#2d2a32" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-32" cy="350" r="15" fill="#ffffff"/><circle cx="32" cy="350" r="15" fill="#ffffff"/>
      <circle cx="-30" cy="352" r="8" fill="#1e1b4b"/><circle cx="34" cy="352" r="8" fill="#1e1b4b"/>
      <circle cx="-27" cy="348" r="3" fill="#ffffff"/><circle cx="37" cy="348" r="3" fill="#ffffff"/>
      <circle cx="-52" cy="388" r="12" fill="#f472b6" opacity="0.45"/><circle cx="52" cy="388" r="12" fill="#f472b6" opacity="0.45"/>
      <path d="M-36 390 Q0 440 36 390 Z" fill="#7a2e2e"/>
      <path d="M-30 392 L30 392 L26 402 L-26 402 Z" fill="#ffffff"/>
      <path d="M-112 532 Q-196 470 -178 390" fill="none" stroke="#f59e0b" stroke-width="48" stroke-linecap="round"/>
      <circle cx="-178" cy="378" r="26" fill="#f1c7a3"/>
      <path d="M112 532 Q186 486 170 420" fill="none" stroke="#f59e0b" stroke-width="48" stroke-linecap="round"/>
      <g transform="translate(170 318) rotate(8)">
        <rect x="-58" y="-98" width="116" height="196" rx="18" fill="#0f1115"/>
        <rect x="-50" y="-88" width="100" height="176" rx="12" fill="url(#smartScreen)"/>
        <text x="0" y="-62" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">How bridges work</text>
        <g transform="translate(0 -18)" fill="none" stroke="#ffffff" stroke-width="3">
          <path d="M-38 16 L38 16 M-30 16 L-30 -8 M30 16 L30 -8 M-38 -2 Q0 -26 38 -2"/>
          <path d="M-20 -12 L-20 16 M-10 -16 L-10 16 M0 -18 L0 16 M10 -16 L10 16 M20 -12 L20 16" stroke-width="2"/>
        </g>
        <g fill="#fef08a">
          <rect x="-34" y="30" width="14" height="30" rx="3"/>
          <rect x="-12" y="18" width="14" height="42" rx="3"/>
          <rect x="10" y="8" width="14" height="52" rx="3"/>
        </g>
      </g>
      <circle cx="168" cy="410" r="26" fill="#f1c7a3"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="700" y1="0" x2="580" y2="720" stroke="#ffffff" stroke-width="8"/>
  <circle cx="640" cy="360" r="42" fill="#0b0c10" stroke="#ffffff" stroke-width="5"/>
  <text x="640" y="374" text-anchor="middle" font-size="36" font-weight="900" fill="#ffffff">vs</text>

  <!-- logo -->
  <g transform="translate(640 50)">
    <rect x="-170" y="-34" width="340" height="68" rx="34" fill="#0b0c10" stroke="url(#logoGrad)" stroke-width="4"/>
    <circle cx="-124" cy="0" r="22" fill="url(#logoGrad)"/>
    <path d="M-132 -12 L-110 0 L-132 12 Z" fill="#0b0c10"/>
    <text x="16" y="14" text-anchor="middle" font-size="40" font-weight="900" fill="#ffffff">Smart<tspan fill="url(#logoGrad)">Tok</tspan></text>
  </g>

  <!-- tagline -->
  <g transform="translate(640 680)">
    <rect x="-190" y="-26" width="380" height="52" rx="26" fill="#0b0c10" opacity="0.85"/>
    <text x="0" y="10" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">Scroll smarter.</text>
  </g>
</svg>
